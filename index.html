function playbackPosition(){return playing?clamp(playing.from+context.currentTime-playing.started,0,duration()):position;}
function stopPlayback(){if(playing){position=playbackPosition();for(const node of playing.nodes){try{node.stop();}catch(_){}}playing=null;}cancelAnimationFrame(raf);$('#play').textContent='▶ 재생';setPosition(position);}
async function play(){if(processing)return;if(playing){stopPlayback();return;}if(!clips.length)return;try{await ensureEffects();}catch(e){status(e.message,true);return;}const ctx=audio();await ctx.resume();if(position>=duration()-.001)setPosition(0);const from=position,started=ctx.currentTime+.04,nodes=[];const events=clips.flatMap(c=>[{at:c.at,g:c.gain*trackGains[c.track]},{at:c.at+length(c),g:-c.gain*trackGains[c.track]}]).sort((a,b)=>a.at-b.at||a.g-b.g);let currentGain=0,maxGain=1;for(const event of events){currentGain+=event.g;maxGain=Math.max(maxGain,currentGain);}const normalization=1/maxGain;for(const c of clips){const end=c.at+length(c);if(end<=from)continue;const src=ctx.createBufferSource(),gain=ctx.createGain(),offset=Math.max(0,from-c.at),when=started+Math.max(0,c.at-from),dur=length(c)-offset;const chosenMedia=media(c);src.buffer=chosenMedia.buffer;const level=c.gain*trackGains[c.track]*normalization,curve=new Float32Array(256);for(let j=0;j<curve.length;j++){const t=offset+dur*j/(curve.length-1);curve[j]=level*envelope(c,t);}gain.gain.setValueCurveAtTime(curve,when,dur);src.connect(gain);gain.connect(master);src.start(when,chosenMedia.offset+offset,dur);nodes.push(src);}playing={from,started,nodes};$('#play').textContent='Ⅱ 일시정지';function tick(){if(!playing)return;setPosition(playbackPosition());if(position>=duration()-.001){stopPlayback();setPosition(duration());return;}raf=requestAnimationFrame(tick);}tick();}
$('#play').onclick=play;$('#stop').onclick=()=>{stopPlayback();setPosition(0);};
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,button'))return;const modifier=e.ctrlKey||e.metaKey;if(modifier&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}else if(modifier&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}else if(modifier&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate();}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();remove();}else if(e.code==='Space'){e.preventDefault();play();}else if(e.key.toLowerCase()==='s'){e.preventDefault();split();}else if(e.key==='Escape'&&drag){endDrag(e,true);}});
function addPerson(){const box=$('#people');if(box.children.length>=6)return;const row=document.createElement('div');row.className='person';for(const [key,title]of [['student','학번'],['name','이름']]){const label=document.createElement('label');label.textContent=title;const input=document.createElement('input');input.className=key;input.type='text';input.placeholder=title;input.autocomplete='off';input.maxLength=key==='student'?10:30;if(key==='student')input.inputMode='numeric';label.appendChild(input);row.appendChild(label);}if(box.children.length){const b=document.createElement('button');b.textContent='삭제';b.onclick=()=>{row.remove();$('#addPerson').disabled=false;};row.appendChild(b);}box.appendChild(row);$('#addPerson').disabled=box.children.length>=6;}
function people(){return Array.from($('#people').children).map(row=>({row,student:row.querySelector('.student').value.trim(),name:row.querySelector('.name').value.trim()}));}
function validatePeople(){for(const [i,p]of people().entries()){for(const input of p.row.querySelectorAll('input'))input.removeAttribute('aria-invalid');const input=!/^\d{4,10}$/.test(p.student)?p.row.querySelector('.student'):!p.name?p.row.querySelector('.name'):null;if(input){input.setAttribute('aria-invalid','true');input.focus();status((i+1)+'번째 참여자의 학번(숫자 4~10자리)과 이름을 모두 입력해 주세요.',true);return false;}}return true;}
$('#addPerson').onclick=addPerson;
function filename(){return people().map(p=>p.student+' '+p.name).join('_').replace(/[\\/:*?"<>|]/g,'_')+'_Layerly';}
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function envelope(c,t){const len=length(c),fi=Math.max(.003,c.fadeIn||0),fo=Math.max(.003,c.fadeOut||0);return Math.max(0,Math.min(1,t/fi,(len-t)/fo));}
function mix(sampleRate){const size=Math.max(1,Math.ceil(duration()*sampleRate)),L=new Float32Array(size),R=new Float32Array(size);for(const c of clips){const chosenMedia=media(c),buffer=chosenMedia.buffer,l=buffer.getChannelData(0),r=buffer.numberOfChannels>1?buffer.getChannelData(1):l,start=Math.round(c.at*sampleRate),count=Math.round(length(c)*sampleRate),fade=Math.min(Math.floor(count/2),Math.round(sampleRate*.003));for(let i=0;i<count&&start+i<size;i++){const index=(chosenMedia.offset+i/sampleRate)*buffer.sampleRate,j=Math.floor(index),f=index-j,env=envelope(c,i/sampleRate);L[start+i]+=((l[j]||0)*(1-f)+(l[j+1]||0)*f)*c.gain*trackGains[c.track]*env;R[start+i]+=((r[j]||0)*(1-f)+(r[j+1]||0)*f)*c.gain*trackGains[c.track]*env;}}let peak=0;for(let i=0;i<size;i++)peak=Math.max(peak,Math.abs(L[i]),Math.abs(R[i]));if(peak>.98){const scale=.98/peak;for(let i=0;i<size;i++){L[i]*=scale;R[i]*=scale;}}return [L,R];}
function wav(L,R,rate){const n=L.length,data=new ArrayBuffer(44+n*4),v=new DataView(data);const str=(at,s)=>{for(let i=0;i<s.length;i++)v.setUint8(at+i,s.charCodeAt(i));};str(0,'RIFF');v.setUint32(4,36+n*4,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,rate,true);v.setUint32(28,rate*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*4,true);for(let i=0;i<n;i++){const l=clamp(L[i],-1,1),r=clamp(R[i],-1,1);v.setInt16(44+i*4,l*(l<0?32768:32767),true);v.setInt16(46+i*4,r*(r<0?32768:32767),true);}return new Blob([data],{type:'audio/wav'});}
$('#download').onclick=async()=>{if(!clips.length||loading||processing||!validatePeople())return;const button=$('#download');button.disabled=true;status('음원을 만드는 중…');try{await ensureEffects();await new Promise(resolve=>requestAnimationFrame(resolve));const rate=audio().sampleRate,[L,R]=mix(rate);saveBlob(wav(L,R,rate),filename()+'.wav');status('완성 음원을 저장했습니다.');}catch(e){status('음원을 저장하지 못했습니다. '+e.message,true);}finally{updateButtons();}};
function image(){const rows=trackLayout(),persons=people(),total=duration(),w=1800,left=100,right=1700,scale=(right-left)/Math.max(.1,total),top=190+persons.length*30,trackHeight=rows.reduce((n,r)=>n+56+r.lanes*70,0),recordHeight=clips.length*34,canvas=document.createElement('canvas');canvas.width=w;canvas.height=top+trackHeight+recordHeight+180;const g=canvas.getContext('2d'),font='"Noto Sans KR","Malgun Gothic",sans-serif';g.fillStyle='white';g.fillRect(0,0,w,canvas.height);function text(t,x,y,size=20,color='#203145',bold=false){g.font=(bold?'700 ':'400 ')+size+'px '+font;g.fillStyle=color;g.fillText(t,x,y);}function fit(t,width){while(t.length>1&&g.measureText(t).width>width)t=t.slice(0,-2)+'…';return t;}text('Layerly · 음원 구성',70,76,38,'#203145',true);persons.forEach((p,i)=>text(p.student+' '+p.name,70,120+i*30,22));text('전체 '+seconds(total)+'초 · '+trackCount+'개 트랙 · '+clips.length+'개 클립',70,155+persons.length*30,22,'#64758a');let y=top;for(const row of rows){text('트랙 '+ALL[row.track]+' · '+Math.round(trackGains[row.track]*100)+'% · '+effect(row.track).pitch+'반음'+' / '+Math.round(effect(row.track).tempo*100)+'%',70,y,23,COLORS[row.track],true);y+=18;const height=row.lanes*70;g.fillStyle='#f1f4f8';g.fillRect(left,y,right-left,height);for(let i=0;i<=8;i++){const x=left+(right-left)*i/8;g.strokeStyle='#d5dfea';g.beginPath();g.moveTo(x,y);g.lineTo(x,y+height);g.stroke();}for(const {clip:c,lane}of row.items){const x=left+c.at*scale,bw=length(c)*scale,by=y+lane*70+4;g.fillStyle=WASH[c.track];g.fillRect(x,by,bw,62);g.save();g.beginPath();g.rect(x,by,bw,62);g.clip();g.fillStyle=COLORS[c.track];g.fillRect(x,by,bw,23);text(fit(sources.get(c.source).name,Math.max(10,bw-14)),x+6,by+17,15,'white');const source=media(c),peaks=source.peaks;g.fillStyle=COLORS[c.track];for(let px=0;px<bw;px++){const index=Math.floor((source.offset+px/Math.max(1,bw)*(source.processed?length(c):c.out-c.in))/source.buffer.duration*peaks.length),h=Math.max(1,(peaks[index]||0)*28);g.fillRect(x+px,by+43-h/2,1,h);}g.restore();}y+=height+22;for(let i=0;i<=8;i++)text((total*i/8).toFixed(1),left+(right-left)*i/8-(i===8?55:0),y,15,'#64758a');y+=26;}y+=20;text('클립별 구성 기록',70,y,24,'#203145',true);y+=36;clips.slice().sort((a,b)=>a.track-b.track||a.at-b.at).forEach((c,i)=>{text((i+1)+'. '+ALL[c.track]+' | 배치 '+seconds(c.at)+'~'+seconds(c.at+length(c))+'초 | 원본 '+seconds(c.in)+'~'+seconds(c.out)+'초 | 음량 '+Math.round(c.gain*100)+'% · 트랙 '+Math.round(trackGains[c.track]*100)+'% · 페이드 '+seconds(c.fadeIn||0)+' / '+seconds(c.fadeOut||0),70,y,17);y+=34;});text('Layerly · 소리를 잇고, 겹치고, 완성하다.',70,canvas.height-30,17,'#64758a');return canvas;}
$('#image').onclick=async()=>{if(!clips.length||loading||processing||!validatePeople())return;$('#image').disabled=true;try{await ensureEffects();if(document.fonts)await document.fonts.ready;const canvas=image();canvas.toBlob(blob=>{if(blob){saveBlob(blob,filename()+'_구성.png');status('구성 이미지를 저장했습니다.');}else status('이미지를 만들지 못했습니다.',true);updateButtons();},'image/png');}catch(e){status('이미지를 저장하지 못했습니다. '+e.message,true);updateButtons();}};
window.addEventListener('resize',()=>{if(!drag)render();});addPerson();render();
})();
</script></body></html>
