<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layerly</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#1c2b39;--sub:#5b6b7a;--line:#d5dde4;--a:#0e7c86;--b:#c26a00;--main:#2a4fd6;--err:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.55}
main{max-width:940px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 20px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.slots{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.slot{border-top:6px solid var(--line)}
.slot[data-k="0"]{border-top-color:var(--a)}
.slot[data-k="1"]{border-top-color:var(--b)}
h2{font-size:16px;margin:0 0 8px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;color:var(--sub);cursor:pointer;font-size:14px}
.drop:hover,.drop:focus-visible,.drop.over{border-color:var(--main);background:#eef2ff;outline:none}
.info{font-size:13px;color:var(--sub);margin:8px 0 4px;word-break:break-all}
.wfwrap{position:relative}
canvas.wf{width:100%;height:76px;display:block;background:#f7f9fb;border-radius:6px;touch-action:none;cursor:ew-resize}
.ph{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#e11d48;pointer-events:none;display:none}
.rng{font-size:13px;margin:6px 0 0;min-height:20px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px}
button.sm{padding:3px 8px;font-size:13px}
button:hover:not(:disabled){border-color:var(--main)}
button:focus-visible{outline:3px solid #9db0ff;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
button.add0{border-color:var(--a);color:var(--a);font-weight:600}
button.add1{border-color:var(--b);color:var(--b);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.panel{margin-top:14px}
#line{display:flex;flex-wrap:wrap;gap:8px;min-height:74px;padding:10px;background:#f7f9fb;border:1px dashed var(--line);border-radius:8px;align-items:stretch}
.empty{color:var(--sub);font-size:14px;align-self:center}
.chip{border-radius:8px;color:#fff;padding:6px 8px;min-width:128px}
.chip.k0{background:var(--a)}.chip.k1{background:var(--b)}
.chip.now{box-shadow:0 0 0 4px #ffd84d}
.chip b{display:block;font-size:15px}
.chip small{display:block;opacity:.92;font-size:12px}
.chip .ctl{display:flex;gap:4px;margin-top:5px}
.chip .ctl button{padding:1px 7px;font-size:13px;background:rgba(255,255,255,.92);border-color:transparent;color:var(--ink)}
.bar{height:6px;background:#e3e9ee;border-radius:3px;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--main);border-radius:3px}
.sum{font-size:15px;margin:10px 0 0}
textarea{font:inherit;width:100%;min-height:76px;padding:8px;border:1px solid var(--line);border-radius:6px;resize:vertical}
input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:170px}
label.l{font-size:14px;color:var(--sub)}
#msg{min-height:22px;margin-top:8px;font-size:14px}
#msg.err{color:var(--err)}
.hidden{display:none}
.hint{font-size:13px;color:var(--sub);margin-top:14px}
[hidden]{display:none!important}select,input[type=number]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px}input[type=number]{width:76px}.chip label{display:block;font-size:12px;margin-top:5px}.chip input{color:var(--ink)}.chip.k2{background:#7651b5}.chip.k3{background:#c13f76}.slot[data-k="2"]{border-top-color:#7651b5}.slot[data-k="3"]{border-top-color:#c13f76}.add2{color:#7651b5}.add3{color:#c13f76}.track{display:flex;gap:10px;align-items:center;margin:6px 0}.track strong{width:18px}.lane{position:relative;flex:1;height:34px;background:#e4eaf0;border-radius:6px;overflow:hidden}.segment{position:absolute;top:2px;bottom:2px;color:white;white-space:nowrap;overflow:hidden;font-size:12px;padding:4px;border-radius:4px;border:1px solid #ffffff80}main{max-width:1120px}.app-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}.brand-sub{color:var(--sub);font-size:13px;margin:2px 0}.identity{text-align:right}.participant{display:flex;justify-content:flex-end;align-items:flex-end;gap:7px;margin-bottom:7px}.participant label{font-size:12px;text-align:left;color:var(--sub)}.participant input[type=text]{display:block;width:110px;margin-top:3px}.identity>button{color:var(--sub)}@media(max-width:600px){.app-header{flex-direction:column}.identity{width:100%}.participant{justify-content:flex-start}.participant input[type=text]{width:120px}}
.time-ruler{position:relative;height:30px;margin:6px 0 0;color:var(--sub);font-size:12px}.time-ruler span{position:absolute;top:5px;transform:translateX(-50%);white-space:nowrap}.time-ruler span:before{content:"";position:absolute;top:-7px;left:50%;height:5px;border-left:1px solid #91a0ad}.time-ruler .first{transform:none}.time-ruler .last{transform:translateX(-100%)}.timeline-ruler{flex:1}.lane{background-image:linear-gradient(to right,#cbd5df 1px,transparent 1px);background-size:20% 100%}.range-inputs label{font-size:13px}.range-inputs input{width:95px}
input[aria-invalid="true"]{border-color:var(--err)!important;outline:2px solid #c0392b30}
</style>
</head>
<body>
<main>
<header class="app-header"><div><h1>Layerly</h1><p class="brand-sub">소리를 잇고, 겹치고, 완성하다.</p></div><section class="identity" aria-label="참여자 정보"><div id="participants"><div class="participant"><label>학번<input class="student-number" type="text" inputmode="numeric" maxlength="10" placeholder="학번" autocomplete="off"></label><label>이름<input class="student-name" type="text" maxlength="30" placeholder="이름" autocomplete="off"></label></div></div><button id="addParticipant" class="sm" type="button">+ 함께한 사람 추가</button></section></header>
<p class="lead">음원을 이어 붙이거나 겹쳐 하나의 음악으로 만들어 보세요.</p>

<div class="row" style="margin-bottom:14px"><button id="addPerson">+ 음원 추가</button><span id="personCount">음원 2개 · 최대 4개</span></div><div class="slots" id="slots"></div>

<section class="card panel">
  <h2>곡 구성</h2><div class="row" style="margin-bottom:12px"><label>합치기 방식 <select id="mixMode"><option value="sequence">순서대로 이어 붙이기</option><option value="parallel">트랙별로 겹쳐 합치기</option></select></label></div><p id="modeHint" class="hint">선택한 구간을 원하는 순서로 이어 붙입니다.</p><div id="timeline" aria-label="트랙별 재생 위치"></div>
  <div class="row" style="margin:0 0 10px">
    <button class="add0" id="add0" disabled>+ A 넣기</button>
    <button class="add1" id="add1" disabled>+ B 넣기</button>
    <button class="add2" id="add2" hidden disabled>+ C 넣기</button><button class="add3" id="add3" hidden disabled>+ D 넣기</button><button id="clear" disabled>모두 지우기</button>
    <span style="font-size:13px;color:var(--sub)">위에서 고른 구간이 그대로 들어갑니다.</span>
  </div>
  <div id="line" aria-label="곡 구성 순서"></div>
  <div class="bar"><i id="fill"></i></div>
  <p class="sum" id="sum"></p>
  <div class="row"><button id="pvAll" disabled>구성 전체 듣기</button><button id="pzAll" disabled>일시정지</button><button id="stAll" disabled>정지</button></div>
</section>

<section class="card panel">
  <h2>내보내기</h2>
  <div class="row">
    <button id="saveImage" disabled>구성 이미지 다운로드</button>
    <button id="dl" class="primary" disabled>WAV 파일로 저장</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</section>

<p class="hint">© 2026 율쌤 ｜ 무단 배포 및 수정 금지</p>
</main>

<script>
(function(){
  var SR = 44100, MAXB = 16, MINLEN = 0.1, NP = 1200;
  var ctx = null, master = null, P = null, raf = 0;
  var clips = [null, null, null, null], rng = [null, null, null, null], peaks = [null, null, null, null], blocks = [];
  var $ = function(s, r){ return (r||document).querySelector(s); };
  var msg = $('#msg'), COLORS = ['#0e7c86', '#c26a00', '#7651b5', '#c13f76'], NAMES = ['A', 'B', 'C', 'D'];
  var slotEl = [], people=2, mode='sequence';

  // ---- 화면 만들기 ----
  [0, 1, 2, 3].forEach(function(k){
    var el = document.createElement('section'); el.className = 'card slot'; el.dataset.k = k;
    el.innerHTML = '<h2>' + NAMES[k] + ' 음원</h2>' +
      '<div class="drop" tabindex="0" role="button" aria-label="' + NAMES[k] + ' 음원 파일 선택">파일을 끌어 놓거나 눌러서 선택<br><small>wav, mp3, m4a</small></div>' +
      '<input type="file" accept="audio/*" class="hidden"><div class="info">아직 파일이 없습니다.</div>' +
      '<div class="wfwrap"><canvas class="wf" aria-label="' + NAMES[k] + ' 음원 구간 선택"></canvas><div class="ph"></div></div><div class="time-ruler source-ruler" aria-label="음원 시간 눈금"></div><div class="rng"></div>' +
      '<div class="row range-inputs"><label>시작(초) <input class="range-start" type="number" min="0" step="0.01" disabled></label><label>끝(초) <input class="range-end" type="number" min="0" step="0.01" disabled></label></div>' +
      '<div class="row"><button class="pa">전체 듣기</button><button class="pv">선택 구간 듣기</button><button class="pz">일시정지</button><button class="st">정지</button></div>' +
      '<div class="row"><button class="trim sm">끝 여백 자동 자르기</button><button class="reset sm">전체 구간</button></div>';
    $('#slots').appendChild(el); slotEl.push(el);el.hidden=k>=people;
  });

  function getCtx(){
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      try { ctx = new AC({latencyHint: 'playback'}); } catch(e){ ctx = new AC(); }
      SR = ctx.sampleRate;
      master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function say(t, err){ msg.textContent = t || ''; msg.className = err ? 'err' : ''; }
  function fmt(s){ var m = Math.floor(s/60); return (m ? m + '분 ' : '') + (s%60).toFixed(1) + '초'; }
  function f1(x){ return x.toFixed(1); }

  // ---- 파일 불러오기 ----
  slotEl.forEach(function(el, k){
    var drop = $('.drop', el), input = $('input', el);
    drop.addEventListener('click', function(){ input.click(); });
    drop.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); input.click(); } });
    drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
    drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer.files[0]) load(k, e.dataTransfer.files[0]); });
    input.addEventListener('change', function(){ if(input.files[0]) load(k, input.files[0]); });
    $('.pa', el).addEventListener('click', function(){ start('clip', k, slice(k, 0, clips[k].dur), 0); });
    $('.pv', el).addEventListener('click', function(){ start('clip', k, slice(k, rng[k].s, rng[k].e), rng[k].s); });
    $('.pz', el).addEventListener('click', function(){ pauseToggle('clip', k); });
    $('.st', el).addEventListener('click', stop);
    $('.trim', el).addEventListener('click', function(){ autoTrim(k); });
    $('.reset', el).addEventListener('click', function(){ rng[k] = {s:0, e:clips[k].dur}; paint(k); });
    ['.range-start','.range-end'].forEach(function(selector){$(selector,el).addEventListener('change',function(){if(!clips[k])return;var value=Number(this.value),isStart=selector==='.range-start';if(!Number.isFinite(value)||value<0||value>clips[k].dur||(isStart?value>rng[k].e-MINLEN:value<rng[k].s+MINLEN)){say('시작'+'·끝 시간은 음원 길이 안에서 0.1초 이상 간격으로 입력해 주세요.',true);paint(k);return;}stop();move(k,isStart?'s':'e',value);paint(k);});});
    handles(k);
  });

  function load(k, file){
    if(file.size>20*1024*1024){say('음원은 20MB 이하로 올려 주세요.',true);return;}stop(); say('음원을 읽는 중입니다…');
    var fr = new FileReader();
    fr.onerror = function(){ say('파일을 읽지 못했습니다. 다시 선택해 주세요.', true); };
    fr.onload = function(){
      getCtx().decodeAudioData(fr.result, function(buf){
        if(buf.duration>300){say('음원은 5분 이내로 올려 주세요.',true);return;}var L = buf.getChannelData(0).slice();
        var R = buf.numberOfChannels > 1 ? buf.getChannelData(1).slice() : L.slice();
        if(clips[k]){ blocks = blocks.filter(function(b){ return b.k !== k; }); }
        clips[k] = { name: file.name, data: [L, R], dur: buf.length / buf.sampleRate };
        rng[k] = { s: 0, e: clips[k].dur };
        var pk = new Float32Array(NP), step = L.length / NP;
        for(var p=0;p<NP;p++){
          var a = Math.floor(p*step), b = Math.min(L.length, Math.floor((p+1)*step)+1), m = 0;
          for(var i=a;i<b;i+=Math.max(1,Math.floor((b-a)/24))){ var v = Math.max(Math.abs(L[i]), Math.abs(R[i])); if(v>m) m = v; }
          pk[p] = Math.min(1, m);
        }
        peaks[k] = pk;
        $('.info', slotEl[k]).textContent = file.name + ' · ' + fmt(clips[k].dur);
        say(''); paint(k); render();
      }, function(){ say('이 파일은 읽을 수 없습니다. wav, mp3, m4a 파일인지 확인해 주세요.', true); });
    };
    fr.readAsArrayBuffer(file);
  }

  // ---- 구간 선택 ----
  function move(k, h, t){
    var d = clips[k].dur, r = rng[k];
    t = Math.max(0, Math.min(d, t));
    if(h === 's') r.s = Math.min(t, r.e - MINLEN); else r.e = Math.max(t, r.s + MINLEN);
    r.s = Math.max(0, r.s); r.e = Math.min(d, r.e);
  }
  function paint(k){
    var c = $('canvas', slotEl[k]), pk = peaks[k];if(clips[k]){drawRuler($('.source-ruler',slotEl[k]),clips[k].dur);$('.range-start',slotEl[k]).value=rng[k].s.toFixed(2);$('.range-end',slotEl[k]).value=rng[k].e.toFixed(2);$('.range-start',slotEl[k]).max=$('.range-end',slotEl[k]).max=clips[k].dur;}
    var dpr = window.devicePixelRatio || 1, w = c.width = c.clientWidth * dpr, h = c.height = 76 * dpr;
    var g = c.getContext('2d'); g.clearRect(0,0,w,h);
    if(!pk) return;
    g.fillStyle = COLORS[k];
    for(var x=0;x<w;x++){ var bh = Math.max(1, pk[Math.min(NP-1, Math.floor(x/w*NP))]*h*0.9); g.fillRect(x, (h-bh)/2, 1, bh); }
    var d = clips[k].dur, xs = rng[k].s/d*w, xe = rng[k].e/d*w;
    g.fillStyle = 'rgba(247,249,251,.82)'; g.fillRect(0,0,xs,h); g.fillRect(xe,0,w-xe,h);
    g.fillStyle = '#1c2b39'; g.fillRect(xs-dpr,0,2*dpr,h); g.fillRect(xe-dpr,0,2*dpr,h);
    g.fillRect(xs-dpr,0,9*dpr,9*dpr); g.fillRect(xe-8*dpr,h-9*dpr,9*dpr,9*dpr);
    $('.rng', slotEl[k]).textContent = '선택 구간 ' + f1(rng[k].s) + '초 ~ ' + f1(rng[k].e) + '초 (길이 ' + f1(rng[k].e - rng[k].s) + '초)';
    ui();
  }
  function handles(k){
    var c = $('canvas', slotEl[k]), drag = null;
    function tOf(e){ var b = c.getBoundingClientRect(); return {t: (e.clientX - b.left)/b.width*clips[k].dur, px: b.width/clips[k].dur}; }
    c.addEventListener('pointerdown', function(e){
      if(!clips[k]) return;
      var o = tOf(e), r = rng[k], ds = Math.abs(o.t - r.s)*o.px, de = Math.abs(o.t - r.e)*o.px;
      drag = (ds < 14 || de < 14) ? (ds <= de ? 's' : 'e') : (Math.abs(o.t - r.s) < Math.abs(o.t - r.e) ? 's' : 'e');
      c.setPointerCapture(e.pointerId); move(k, drag, o.t); paint(k);
    });
    c.addEventListener('pointermove', function(e){ if(drag){ move(k, drag, tOf(e).t); paint(k); } });
    function up(){ drag = null; }
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  }
  function autoTrim(k){
    var L = clips[k].data[0], R = clips[k].data[1], peak = 0, i;
    for(i=0;i<L.length;i+=8){ var v = Math.max(Math.abs(L[i]), Math.abs(R[i])); if(v > peak) peak = v; }
    var thr = Math.max(0.01, peak*0.03), win = Math.round(SR*0.01), end = L.length;
    for(var p=L.length-win; p>=0; p-=win){
      var m = 0;
      for(i=p;i<p+win;i++){ var q = Math.max(Math.abs(L[i]), Math.abs(R[i])); if(q > m) m = q; }
      if(m > thr){ end = p + win; break; }
    }
    var e = Math.min(clips[k].dur, end/SR + 0.05), cut = clips[k].dur - e;
    if(cut < 0.05){ say('자를 끝 여백이 거의 없습니다.'); return; }
    rng[k].e = Math.max(e, rng[k].s + MINLEN); paint(k);
    say('끝 여백 ' + f1(cut) + '초를 잘랐습니다. 박이 맞는지 이음새를 들어 보고, 필요하면 끝 손잡이로 조정하세요.');
  }

  // ---- 구성 편집 ----
  function stopAll(){ if(P && P.kind === 'all') stop(); }
  function add(k){
    if(blocks.length >= MAXB){ say('최대 ' + MAXB + '개까지 넣을 수 있습니다.', true); return; }
    stopAll();var at=mode==='parallel'?trackEnd(k):0;if((mode==='parallel'?at:duration())+rng[k].e-rng[k].s>300){say('곡 길이는 최대 5분입니다.',true);return;}blocks.push({k:k, s:rng[k].s, e:rng[k].e,at:at,gain:1}); say(''); render();
  }
  $('#add0').addEventListener('click', function(){ add(0); });
  $('#add1').addEventListener('click', function(){ add(1); });
  $('#add2').addEventListener('click',function(){add(2);});$('#add3').addEventListener('click',function(){add(3);});
  $('#addPerson').onclick=function(){if(people>=4)return;people++;slotEl[people-1].hidden=false;$('#add'+(people-1)).hidden=false;$('#personCount').textContent='음원 '+people+'개 · 최대 4개';this.disabled=people>=4;render();};
  $('#mixMode').onchange=function(){stop();mode=this.value;if(mode==='parallel'){var ends=[0,0,0,0];blocks.forEach(function(b){b.at=ends[b.k];ends[b.k]+=b.e-b.s;});}if(duration()>300){mode='parallel';this.value=mode;say('이어 붙이면 5분을 넘어 겹치기 방식을 유지합니다.',true);}$('#modeHint').textContent=mode==='parallel'?'A·B·C·D는 각각 한 트랙입니다. 시작(초)과 음량을 조절해 원하는 시점에 겹쳐 보세요.':'선택한 구간을 원하는 순서로 이어 붙입니다.';render();};
  $('#clear').addEventListener('click', function(){ stopAll(); blocks = []; render(); });

  function render(){
    var line = $('#line'); line.innerHTML = '';
    if(!blocks.length){
      line.innerHTML = '<span class="empty">원하는 구간을 선택하고 A·B·C·D 넣기를 누르면 해당 구간이 곡에 추가됩니다.</span>';
    }
    blocks.forEach(function(b, i){
      var part = b.s > 0.005 || b.e < clips[b.k].dur - 0.005;
      var d = document.createElement('div'); d.className = 'chip k' + b.k;
      d.innerHTML = '<b>' + (i+1) + '. ' + NAMES[b.k] + '</b><small>' + f1(b.s) + '~' + f1(b.e) + '초 · ' + f1(b.e-b.s) + '초' + (part ? ' (일부)' : '') + '</small><div class="ctl"></div>';
      var timing=document.createElement('label');timing.textContent=mode==='parallel'?'시작(초) ':'재생 시작 '+f1(schedule()[i].at)+'초';
      if(mode==='parallel'){var atInput=document.createElement('input');atInput.type='number';atInput.min=0;atInput.max=300-(b.e-b.s);atInput.step='0.1';atInput.value=f1(b.at||0);atInput.setAttribute('aria-label',(i+1)+'번 '+NAMES[b.k]+' 시작 초');atInput.onchange=function(){var at=Number(this.value);if(!Number.isFinite(at)||at<0||at+b.e-b.s>300){this.value=f1(b.at||0);return;}stop();b.at=at;render();};timing.appendChild(atInput);}d.appendChild(timing);
      var volume=document.createElement('label');volume.textContent='음량 ';var gain=document.createElement('input');gain.type='number';gain.min=0;gain.max=100;gain.step=5;gain.value=Math.round((b.gain==null?1:b.gain)*100);gain.setAttribute('aria-label',(i+1)+'번 '+NAMES[b.k]+' 음량 퍼센트');gain.onchange=function(){var v=Number(this.value);if(!Number.isFinite(v)||v<0||v>100){this.value=Math.round((b.gain==null?1:b.gain)*100);return;}stop();b.gain=v/100;};volume.appendChild(gain);volume.appendChild(document.createTextNode('%'));d.appendChild(volume);
      var ctl = $('.ctl', d);
      [['◀','앞으로',function(){ swap(i,i-1); }, i===0],
       ['▶','뒤로',function(){ swap(i,i+1); }, i===blocks.length-1],
       ['복제','복제',function(){ dup(i); }, false],
       ['✕','삭제',function(){ stopAll(); blocks.splice(i,1); render(); }, false]].forEach(function(x){
        var bt = document.createElement('button'); bt.textContent = x[0]; bt.title = x[1];
        bt.setAttribute('aria-label', (i+1) + '번 ' + x[1]); bt.disabled = x[3]; bt.addEventListener('click', x[2]); ctl.appendChild(bt);
      });
      line.appendChild(d);
    });
    var has = blocks.length > 0, total = duration();renderTimeline();
    $('#sum').textContent = has ? '구성: ' + blocks.map(function(b){ return NAMES[b.k]; }).join(mode==='parallel'?' + ':' → ') + '  ·  총 ' + fmt(total) : '';
    $('#clear').disabled = $('#dl').disabled = $('#saveImage').disabled = !has;
    ui();
  }
  function swap(a, b){ stopAll(); var t = blocks[a]; blocks[a] = blocks[b]; blocks[b] = t; render(); }
  function dup(i){
    if(blocks.length >= MAXB){ say('최대 ' + MAXB + '개까지 넣을 수 있습니다.', true); return; }
    var b=blocks[i],at=mode==='parallel'?trackEnd(b.k):0;if((mode==='parallel'?at:duration())+b.e-b.s>300){say('곡 길이는 최대 5분입니다.',true);return;}stopAll();blocks.splice(i+1,0,{k:b.k,s:b.s,e:b.e,at:at,gain:b.gain});render();
  }

  // ---- 소리 만들기 ----
  function slice(k, s, e){
    var a = Math.round(s*SR), b = Math.min(clips[k].data[0].length, Math.round(e*SR)), n = Math.max(1, b - a);
    var out = [clips[k].data[0].slice(a, a+n), clips[k].data[1].slice(a, a+n)];
    var fo = Math.min(n>>1, Math.round(SR*0.005)), fi = s > 0.001 ? Math.min(n>>1, Math.round(SR*0.003)) : 0, i;
    out.forEach(function(ch){
      for(i=0;i<fi;i++) ch[i] *= i/fi;
      for(i=0;i<fo;i++) ch[n-1-i] *= i/fo;
    });
    return out;
  }
  function schedule(){var cursor=0;return blocks.map(function(b){var at=mode==='parallel'?(b.at||0):cursor;cursor+=b.e-b.s;return {at:at,end:at+b.e-b.s};});}
  function duration(){return schedule().reduce(function(n,b){return Math.max(n,b.end);},0);}
  function trackEnd(k){return blocks.reduce(function(n,b){return b.k===k?Math.max(n,(b.at||0)+b.e-b.s):n;},0);}
  function drawRuler(box,total){box.replaceChildren();for(var i=0;i<=5;i++){var tick=document.createElement('span');tick.textContent=(total*i/5).toFixed(1)+'초';tick.style.left=(i*20)+'%';if(i===0)tick.className='first';if(i===5)tick.className='last';box.appendChild(tick);}}
  function renderTimeline(){var box=$('#timeline');box.replaceChildren();if(!blocks.length)return;var times=schedule(),total=duration();var rulerRow=document.createElement('div');rulerRow.className='track';var spacer=document.createElement('strong');spacer.textContent='초';rulerRow.appendChild(spacer);var ruler=document.createElement('div');ruler.className='time-ruler timeline-ruler';drawRuler(ruler,total);rulerRow.appendChild(ruler);box.appendChild(rulerRow);for(var k=0;k<people;k++){var row=document.createElement('div');row.className='track';var name=document.createElement('strong');name.textContent=NAMES[k];row.appendChild(name);var lane=document.createElement('div');lane.className='lane';blocks.forEach(function(b,i){if(b.k!==k)return;var bar=document.createElement('span');bar.className='segment';bar.style.left=(times[i].at/total*100)+'%';bar.style.width=((b.e-b.s)/total*100)+'%';bar.style.background=COLORS[k];bar.textContent=(i+1)+'. '+NAMES[k]+' · '+f1(times[i].at)+'~'+f1(times[i].end)+'초';bar.title=bar.textContent;lane.appendChild(bar);});row.appendChild(lane);box.appendChild(row);}}

  function build(){
    var times=schedule(),n=Math.max(1,Math.ceil(duration()*SR)),L=new Float32Array(n),R=new Float32Array(n);
    blocks.forEach(function(b,i){var part=slice(b.k,b.s,b.e),o=Math.round(times[i].at*SR),gain=b.gain==null?1:b.gain;for(var j=0;j<part[0].length&&o+j<n;j++){L[o+j]+=part[0][j]*gain;R[o+j]+=part[1][j]*gain;}});
    var peak=0;for(var i=0;i<n;i++)peak=Math.max(peak,Math.abs(L[i]),Math.abs(R[i]));if(peak>0.98){var scale=0.98/peak;for(var i=0;i<n;i++){L[i]*=scale;R[i]*=scale;}}return [L,R];
  }

  // ---- 재생 (재생 위치 표시·일시정지) ----
  function pos(){ return P ? Math.max(0, Math.min(P.dur, ctx.currentTime - P.t0)) : 0; }
  function ph(k, t){
    var el = $('.ph', slotEl[k]);
    if(t == null || !clips[k]){ el.style.display = 'none'; return; }
    el.style.display = 'block'; el.style.left = (t / clips[k].dur * 100) + '%';
  }
  function start(kind, k, data, base){
    stop();
    var c = getCtx(), buf = c.createBuffer(2, data[0].length, c.sampleRate);
    buf.copyToChannel(data[0], 0); buf.copyToChannel(data[1], 1);
    var src = c.createBufferSource(); src.buffer = buf; src.connect(master);
    var t0 = c.currentTime + 0.05; src.start(t0);
    P = { src: src, kind: kind, k: k, base: base, t0: t0, dur: buf.duration, paused: false };
    src.onended = function(){ if(P && P.src === src) stop(); };
    ui(); tick();
  }
  function tick(){
    if(!P) return;
    var t = pos();
    [0,1,2,3].forEach(function(k){ph(k,null);});
    if(P.kind==='clip')ph(P.k,P.base+t);
    else{var times=schedule();document.querySelectorAll('.chip').forEach(function(ch,i){var active=t>=times[i].at&&t<times[i].end;ch.classList.toggle('now',active);if(active)ph(blocks[i].k,blocks[i].s+t-times[i].at);});$('#fill').style.width=(t/P.dur*100)+'%';}
    raf = requestAnimationFrame(tick);
  }
  function pauseToggle(kind, k){
    if(!P || P.kind !== kind || (kind === 'clip' && P.k !== k)) return;
    if(P.paused) ctx.resume(); else ctx.suspend();
    P.paused = !P.paused; ui();
  }
  function stop(){
    cancelAnimationFrame(raf);
    if(P){ try{ P.src.onended = null; P.src.stop(); }catch(e){} }
    P = null;
    if(ctx && ctx.state === 'suspended') ctx.resume();
    [0,1,2,3].forEach(function(k){ph(k,null);});
    document.querySelectorAll('.chip.now').forEach(function(c){ c.classList.remove('now'); });
    $('#fill').style.width = '0';
    ui();
  }
  function ui(){
    slotEl.forEach(function(el, k){
      var en = !!clips[k], mine = !!(P && P.kind === 'clip' && P.k === k);
      ['.pa','.pv','.trim','.reset','.range-start','.range-end'].forEach(function(s){ $(s, el).disabled = !en; });
      $('.pz', el).disabled = $('.st', el).disabled = !mine;
      $('.pz', el).textContent = (mine && P.paused) ? '계속 재생' : '일시정지';
      $('#add' + k).disabled = !en;
    });
    var all = !!(P && P.kind === 'all');
    $('#pvAll').disabled = !blocks.length;
    $('#pzAll').disabled = $('#stAll').disabled = !all;
    $('#pzAll').textContent = (all && P.paused) ? '계속 재생' : '일시정지';
  }
  $('#pvAll').addEventListener('click', function(){ if(blocks.length) start('all', 0, build(), 0); });
  $('#pzAll').addEventListener('click', function(){ pauseToggle('all'); });
  $('#stAll').addEventListener('click', stop);

  var participantCount=1;
  $('#addParticipant').onclick=function(){if(participantCount>=4)return;participantCount++;var row=document.createElement('div');row.className='participant';row.innerHTML='<label>학번<input class="student-number" type="text" inputmode="numeric" maxlength="10" placeholder="학번" autocomplete="off"></label><label>이름<input class="student-name" type="text" maxlength="30" placeholder="이름" autocomplete="off"></label><button class="sm" type="button" aria-label="참여자 삭제">삭제</button>';row.querySelector('button').onclick=function(){row.remove();participantCount--;$('#addParticipant').disabled=false;};$('#participants').appendChild(row);this.disabled=participantCount>=4;};
  function participantText(){return Array.from(document.querySelectorAll('#participants .participant')).map(function(row){return [row.querySelector('.student-number').value.trim(),row.querySelector('.student-name').value.trim()].filter(Boolean).join(' ');}).filter(Boolean).join('_');}
  function validateParticipants(){
    var rows=Array.from(document.querySelectorAll('#participants .participant'));
    for(var i=0;i<rows.length;i++){
      var number=rows[i].querySelector('.student-number'),name=rows[i].querySelector('.student-name');
      number.removeAttribute('aria-invalid');name.removeAttribute('aria-invalid');
      if(!/^\d{4,10}$/.test(number.value.trim())){say((i+1)+'번째 참여자의 학번을 숫자 4~10자리로 입력해 주세요.',true);number.setAttribute('aria-invalid','true');number.focus();return false;}
      if(!name.value.trim()){say((i+1)+'번째 참여자의 이름을 입력해 주세요.',true);name.setAttribute('aria-invalid','true');name.focus();return false;}
    }
    if(!rows.length){say('학번과 이름을 입력해 주세요.',true);return false;}return true;
  }
  // ---- 구성 이미지 · WAV 저장 ----
  function compositionImage(){
    if(!blocks.length)return null;
    var times=schedule(),total=duration(),tracks=[],left=90,width=1420;
    for(var k=0;k<people;k++){var ends=[],items=[];blocks.map(function(b,i){return {b:b,i:i,t:times[i]};}).filter(function(x){return x.b.k===k;}).sort(function(a,b){return a.t.at-b.t.at||a.i-b.i;}).forEach(function(x){var lane=ends.findIndex(function(e){return e<=x.t.at+0.000001;});if(lane<0)lane=ends.length;ends[lane]=x.t.end;x.lane=lane;items.push(x);});tracks.push({k:k,items:items,lanes:Math.max(1,ends.length)});}
    var height=300+tracks.reduce(function(n,t){return n+78+t.lanes*44;},0)+140+blocks.length*36;
    var canvas=document.createElement('canvas');canvas.width=1600;canvas.height=height;var g=canvas.getContext('2d');
    var font='"Noto Sans KR","Malgun Gothic",sans-serif';
    function text(t,x,y,size,color,bold){g.font=(bold?'700 ':'400 ')+size+'px '+font;g.fillStyle=color||'#1c2b39';g.fillText(t,x,y);}
    function fit(t,max){while(t.length&&g.measureText(t).width>max)t=t.slice(0,-2)+'…';return t;}
    g.fillStyle='#fff';g.fillRect(0,0,1600,height);text('Layerly · 음원 구성',70,80,38,null,true);
    var identity=participantText().split('_');identity.forEach(function(t,i){text(t||'이름 미입력',70,124+i*32,23);});
    var y=150+Math.max(0,identity.length-1)*32;text((mode==='parallel'?'트랙별 겹치기':'순서대로 이어 붙이기')+' · 전체 '+f1(total)+'초',70,y+20,24,'#5b6b7a');y+=60;
    // Reserve enough vertical space for up to four participant names.
    if(identity.length>1){height+=(identity.length-1)*32;canvas.height=height;g.fillStyle='#fff';g.fillRect(0,0,1600,height);text('Layerly · 음원 구성',70,80,38,null,true);identity.forEach(function(t,i){text(t||'이름 미입력',70,124+i*32,23);});text((mode==='parallel'?'트랙별 겹치기':'순서대로 이어 붙이기')+' · 전체 '+f1(total)+'초',70,170+(identity.length-1)*32,24,'#5b6b7a');}
    tracks.forEach(function(track){var k=track.k;g.font='400 20px '+font;text(NAMES[k]+' · '+fit(clips[k]?(clips[k].name||'음원'):'미등록',1400),70,y,20,COLORS[k],true);y+=18;var laneHeight=track.lanes*44;g.fillStyle='#edf1f5';g.fillRect(left,y,width,laneHeight);for(var tick=0;tick<=5;tick++){var x=left+width*tick/5;g.strokeStyle='#d5dde4';g.beginPath();g.moveTo(x,y);g.lineTo(x,y+laneHeight);g.stroke();}track.items.forEach(function(x){var bx=left+x.t.at/total*width,bw=(x.b.e-x.b.s)/total*width,by=y+x.lane*44+3;g.fillStyle=COLORS[k];g.fillRect(bx,by,Math.max(2,bw),38);g.save();g.beginPath();g.rect(bx+2,by,Math.max(0,bw-4),38);g.clip();text((x.i+1)+'. '+NAMES[k],bx+6,by+26,18,'#fff',true);g.restore();});y+=laneHeight+24;for(var tick=0;tick<=5;tick++)text(f1(total*tick/5)+'초',left+width*tick/5-(tick===5?55:0),y,16,'#5b6b7a');y+=36;});
    y+=22;text('구간별 구성 기록',70,y,26,null,true);y+=38;
    blocks.forEach(function(b,i){text((i+1)+'. '+NAMES[b.k]+'  |  원본 '+f1(b.s)+'~'+f1(b.e)+'초  |  배치 '+f1(times[i].at)+'~'+f1(times[i].end)+'초  |  음량 '+Math.round((b.gain==null?1:b.gain)*100)+'%',70,y,21);y+=36;});
    text('Layerly · 소리를 잇고, 겹치고, 완성하다.',70,height-34,18,'#5b6b7a');return canvas;
  }
  $('#saveImage').onclick=async function(){if(!blocks.length||!validateParticipants())return;this.disabled=true;try{if(document.fonts)await document.fonts.ready;var canvas=compositionImage();canvas.toBlob(function(blob){if(!blob){say('이미지를 만들지 못했습니다. 다시 시도해 주세요.',true);$('#saveImage').disabled=false;return;}var name=(participantText()?participantText().replace(/[\\/:*?"<>|]/g,'_')+'_':'')+'Layerly_구성.png',url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);say('구성 이미지를 저장했습니다. 음원과 함께 제출해 주세요.');$('#saveImage').disabled=false;},'image/png');}catch(e){say('이미지를 저장하지 못했습니다. 다시 시도해 주세요.',true);this.disabled=false;}};

  function toWav(L, R){
    var n = L.length, buf = new ArrayBuffer(44 + n*4), v = new DataView(buf);
    function str(o, s){ for(var i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
    str(0,'RIFF'); v.setUint32(4,36+n*4,true); str(8,'WAVE'); str(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
    v.setUint32(24,SR,true); v.setUint32(28,SR*4,true); v.setUint16(32,4,true); v.setUint16(34,16,true);
    str(36,'data'); v.setUint32(40,n*4,true);
    var o = 44;
    for(var i=0;i<n;i++){
      var l = Math.max(-1,Math.min(1,L[i])), r = Math.max(-1,Math.min(1,R[i]));
      v.setInt16(o, l<0 ? l*0x8000 : l*0x7FFF, true); o+=2;
      v.setInt16(o, r<0 ? r*0x8000 : r*0x7FFF, true); o+=2;
    }
    return new Blob([buf], {type:'audio/wav'});
  }
  $('#dl').addEventListener('click', function(){
    if(!blocks.length||!validateParticipants())return;
    var d = build(), who = participantText().replace(/[\\/:*?"<>|]/g,'_').trim();
    var name = (who ? who + '_' : '') + 'Layerly';
    var url = URL.createObjectURL(toWav(d[0], d[1]));
    var a = document.createElement('a'); a.href = url; a.download = name + '.wav';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    say('"' + name + '.wav" 파일로 저장했습니다. 다운로드 폴더를 확인하세요.');
  });

  window.addEventListener('resize', function(){ [0,1,2,3].forEach(function(k){ if(clips[k]) paint(k); }); });
  render();
})();
</script>
